name: Release

# Every push to main that passes CI is released, unless it only touched docs,
# CI config or tools/: the version is bumped everywhere, the wasm modules (which
# carry it) are rebuilt, and the result is committed to main, tagged and
# released with notes from the pull requests since the last release.
#
# How big a bump is read from conventional titles (tools/release-plan.mjs):
# `feat:` is minor, `feat!:` or a "BREAKING CHANGE" is major, anything else
# a patch. "Run workflow" releases by hand, with the size chosen there.
#
# Each release also carries the desktop app (desktop/, Tauri): an AppImage built
# on Linux and an installer .exe built on Windows, from the tagged commit.
#
# The release commit is pushed with the workflow's own token, which starts no
# workflows of its own, so this does not run on itself.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: How big a release
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Bump, rebuild and release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      released: ${{ steps.plan.outputs.bump != 'none' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0

      - name: What to release
        id: plan
        run: |
          bump=$(node tools/release-plan.mjs "${{ inputs.bump || 'auto' }}")
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "release plan: $bump"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.plan.outputs.bump != 'none'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.plan.outputs.bump != 'none'
        with:
          workspaces: core
          key: release

      - name: Bump the version everywhere
        id: bump
        if: steps.plan.outputs.bump != 'none'
        run: |
          if [ "${{ steps.plan.outputs.bump }}" = current ]; then
            version=$(grep -m1 '^version' core/Cargo.toml | cut -d'"' -f2)
          else
            version=$(node tools/bump-version.mjs "${{ steps.plan.outputs.bump }}")
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version"

      - name: Rebuild the wasm modules
        if: steps.plan.outputs.bump != 'none'
        run: |
          tools/build.sh --wasm
          for module in darkroom critic; do
            grep -aq "LumiRaw ${{ steps.bump.outputs.version }}" "web/src/lib/wasm/$module.wasm" \
              || { echo "::error::$module.wasm does not say ${{ steps.bump.outputs.version }}"; exit 1; }
          done

      - name: Commit, tag and push
        if: steps.plan.outputs.bump != 'none'
        run: |
          version=${{ steps.bump.outputs.version }}
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A core web desktop .github tools
          git diff --cached --quiet || git commit -m "Release $version"
          git tag "v$version"
          # Refused if main has moved on since CI ran: the run for the newer
          # commit releases that instead.
          git push --atomic origin HEAD:main "v$version"

      - name: Publish the release
        if: steps.plan.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v${{ steps.bump.outputs.version }}
          gh release create "$tag" --verify-tag --title "$tag" --generate-notes

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux AppImage
            os: ubuntu-22.04
            bundle: appimage
            files: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Windows installer
            os: windows-latest
            bundle: nsis
            files: desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: desktop
      - name: WebKitGTK and the AppImage tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf file
      - name: Build the site
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Build the app
        working-directory: desktop
        run: npm ci --no-audit --no-fund && npx tauri build --bundles ${{ matrix.bundle }}
      - name: Attach it to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.release.outputs.version }}" ${{ matrix.files }} --clobber
