name: Release

# A release for every version that reaches main: once CI has passed on a
# commit whose core/Cargo.toml names a version with no tag yet, that commit
# is tagged and released, with notes from the pull requests since the last
# one. Bumping the version (see the "Versions agree" job) is all it takes.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Release the version, unless it already is
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(grep -m1 '^version' core/Cargo.toml | cut -d'"' -f2)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag is already released"
            exit 0
          fi
          gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes
          echo "released $tag at $SHA"
