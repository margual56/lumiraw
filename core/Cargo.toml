[package]
name = "autoraw-core"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
kit = { path = "kit" }
rawler = { path = "vendor/rawler", default-features = false }
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
jpeg-encoder = "0.6"
tiff = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", default-features = false, features = ["rng-getrandom"] }

[workspace]
members = ["kit", "darkroom"]
exclude = ["vendor/rawler"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"
incremental = true
opt-level = 0

[profile.ci.package."*"]
opt-level = 3

[profile.ci.package.rawler]
opt-level = 0
