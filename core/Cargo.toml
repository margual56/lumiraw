[package]
name = "autoraw-core"
version = "0.5.2"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rawloader = "0.37"
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
jpeg-encoder = "0.6"
tiff = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
