[package]
name = "critic"
version = "1.6.1"
edition = "2021"
description = "NIMA photo scoring for lumiraw, as its own wasm module"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The wasm module's own exports. Off when the pipeline links the crate in for
# its networks, so the developer's module does not carry the culling one's API.
default = ["module"]
module = []
