[package]
name = "darkroom"
version = "0.9.5"
edition = "2021"
description = "LumiRaw's API: open a raw, develop it, compare, export, merge a bracket."
publish = false

[lib]
# The rlib is the API for Rust; the cdylib is the same API compiled to the
# wasm module the web app loads (see src/wasm.rs).
crate-type = ["cdylib", "rlib"]

[dependencies]
autoraw-core = { path = ".." }
kit = { path = "../kit" }
serde_json = "1"
