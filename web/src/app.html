<!doctype html>
<html lang="%lang%">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d0e10" />
  <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
  <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
  <script>
    // The browser's offer to install the page as an app can come before the
    // page's own code has started; kept here until lib/install.svelte.js
    // picks it up. Only browsers that can install a page send it.
    addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); window.__install = e; });
  </script>
  %sveltekit.head%
</head>
<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>
</html>
